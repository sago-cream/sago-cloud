name: sago-cloud-minisago-worker

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

x-worker: &worker
  image: ghcr.io/sago-cream/minisago-worker:${MINISAGO_WORKER_IMAGE_TAG:-main}
  restart: unless-stopped
  init: true
  cpus: 1.25
  mem_limit: 8g
  security_opt:
    - apparmor=minisago-worker
    - seccomp=/srv/sago-cloud/operations/services/minisago-worker/minisago-worker.seccomp.json
  logging: *default-logging
  labels:
    dev.hsichen.sago-cloud.managed: "true"
  networks:
    - frontend
    - sandbox-internal

services:
  worker:
    <<: *worker
    env_file:
      - /srv/sago-cloud/secrets/minisago-worker.env
    environment:
      MINISAGO_SANDBOX_URL: http://sandbox:8080
      MINISAGO_DEPLOY_SOCKET: /run/sago-cloud/minisago-deploy.sock
      MINISAGO_WORKER_ID: oracle
      MINISAGO_WORKER_CAPABILITIES: chat,dev
    depends_on:
      sandbox:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8081/health');process.exit(r.ok?0:1)",
        ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 15s
    volumes:
      - minisago-codex:/home/bun/.codex
      - minisago-github:/home/bun/.config/gh
      - minisago-state:/var/lib/minisago
      - minisago-workspace:/workspace
      - /run/sago-cloud/minisago-deploy.sock:/run/sago-cloud/minisago-deploy.sock

  sandbox:
    image: ghcr.io/sago-cream/minisago-worker:${MINISAGO_WORKER_IMAGE_TAG:-main}
    restart: unless-stopped
    init: true
    entrypoint: ["bun"]
    command: ["src/sandbox-broker.ts"]
    user: "0:0"
    environment:
      HOME: /tmp
      MINISAGO_SANDBOX_IMAGE: ghcr.io/sago-cream/minisago-worker:${MINISAGO_WORKER_IMAGE_TAG:-main}
      MINISAGO_SANDBOX_JOBS_ROOT: /var/lib/minisago-sandbox
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/minisago-sandbox:/var/lib/minisago-sandbox
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m,mode=0700
    healthcheck:
      test:
        [
          "CMD",
          "bun",
          "-e",
          "const r=await fetch('http://127.0.0.1:8080/health');process.exit(r.ok?0:1)",
        ]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - sandbox-internal

networks:
  frontend:
    external: true
    name: ${EDGE_NETWORK_NAME:-sago_cloud_edge}
  sandbox-internal:
    internal: true

volumes:
  minisago-codex:
    external: true
    name: sago_cloud_minisago-codex
  minisago-github:
    external: true
    name: sago_cloud_minisago-github
  minisago-state:
    external: true
    name: sago_cloud_minisago-state
  minisago-workspace:
    external: true
    name: sago_cloud_minisago-workspace
